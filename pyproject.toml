[project]
name = "parity-regime-lab"
version = "0.1.0"
description = "Reproducible experiments for parity regime-switching, local diagnostics, and 1/(2 ln 2) curvature."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pandas>=2.0"]
# numba JIT-compiles the HMM forward/backward loops (~50-100x speedup on n=20000).
# Install with: pip install parity-regime-lab[fast]
fast = ["numba>=0.57"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
